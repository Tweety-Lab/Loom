# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Loom.slnx
    - name: Build
      run: dotnet build Loom.slnx --no-restore
    - name: Test
      run: dotnet test Loom.slnx --no-build --verbosity normal
    - name: Publish CLI
      run: >-
        dotnet publish Loom.CLI/Loom.CLI.csproj
        --configuration Release
        --output artifacts/loom
        -p:DebugType=None
        -p:DebugSymbols=false

    - name: Upload CLI
      uses: actions/upload-artifact@v4
      with:
        name: Loom.CLI
        path: |
          artifacts/loom/**
          !artifacts/loom/**/*.pdb
        if-no-files-found: error
